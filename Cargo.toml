[package]
name = "rinka_soundbridge"
version = "2.0.0"
edition = "2021"
authors = ["Rinka VTuber Project"]
description = "Rinka SoundBridge v2.0 - Full Native Rust Dual-Line Audio Router (WASAPI Shared, WASAPI Exclusive & ASIO Native) & VST3 Host"

[lib]
name = "rinka_soundbridge_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "RinkaSoundBridge"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "wav", "ogg", "flac", "pcm", "aiff"] }
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
arc-swap = "1.7"
chrono = "0.4"
rfd = "0.14"
libloading = "0.8"
rand = "0.8"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
